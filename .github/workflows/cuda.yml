name: CUDA hardware acceptance

# Requires a configured NVIDIA runner. Do not silently substitute hosted CPU
# checks for device acceptance, and do not run PR code on a self-hosted GPU.
on:
  workflow_dispatch:
    inputs:
      julia:
        description: Julia version
        type: choice
        options: ['1.13', '1.10']
        default: '1.13'
      benchmark:
        description: Also run the synchronized 18-qubit benchmark
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cuda:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 45
    env:
      JULIA_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.julia }}
      - name: Prepare the companion environment
        shell: julia --startup-file=no {0}
        run: |
          using Pkg
          Pkg.activate(joinpath(ENV["RUNNER_TEMP"], "mossquantum-cuda"))
          Pkg.develop(path=pwd())
          Pkg.develop(path=joinpath(pwd(), "packages", "MOSSQuantumCUDA"))
          Pkg.add("CUDA")
      - name: Require real GPU acceptance
        run: julia --startup-file=no --project="$RUNNER_TEMP/mossquantum-cuda" -e 'using Pkg; Pkg.test("MOSSQuantumCUDA"; test_args=["--require-gpu"])'
      - name: Measure synchronized execution and transfers
        if: ${{ inputs.benchmark }}
        run: julia --startup-file=no --project="$RUNNER_TEMP/mossquantum-cuda" packages/MOSSQuantumCUDA/benchmark/run.jl 18 10
