name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia }} / ${{ matrix.threads }} threads
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - julia: '1.10'
            threads: '1'
          - julia: '1.13'
            threads: '4'
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
      GKSwstype: '100'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - name: Resolve dependencies for this Julia version
        shell: julia --project=. {0}
        run: |
          using Pkg
          # Resolve the 1.13 development manifest for each supported Julia version.
          rm("Manifest.toml"; force=true)
          Pkg.instantiate()
      - name: Check core loading without optional packages
        run: julia --project=. --startup-file=no test/extensions/load_order.jl core
      - name: Run package and integration loading tests
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.test(; test_args=["--load-orders"])'

  independent-extension:
    name: ${{ matrix.fixture }} / Julia ${{ matrix.julia }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1.13']
        fixture: ['MOSSDemoBackend', 'MOSSDemoGates', 'MOSSDemoDifferentiation']
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - name: Test extension against the local MOSS source
        run: julia --project=test/fixtures/${{ matrix.fixture }} --startup-file=no -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.test()'

  benchmark-smoke:
    name: Benchmark harness / Julia ${{ matrix.julia }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1.13']
    env:
      JULIA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - name: Prepare the independent benchmark environment
        run: julia --project=benchmark --startup-file=no -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Check core repeated-evaluation workloads without AD
        run: julia --project=benchmark --startup-file=no benchmark/repeated_evaluation.jl --steady-only --seconds 0.01 --qubits 2 --depth 2
      - name: Check optional AD adapter workloads in a fresh process
        run: julia --project=benchmark --startup-file=no benchmark/repeated_evaluation.jl --steady-only --with-zygote --seconds 0.01 --qubits 2 --depth 2
      - name: Check pure-state batch workloads without AD
        run: julia --project=benchmark --startup-file=no benchmark/batch_evaluation.jl --steady-only --seconds 0.01 --qubits 2 --depth 2
      - name: Check optional batch AD workloads in a fresh process
        run: julia --project=benchmark --startup-file=no benchmark/batch_evaluation.jl --steady-only --with-zygote --seconds 0.01 --qubits 2 --depth 2
      - name: Check pure and mixed batch execution workloads without AD
        run: julia --project=benchmark --startup-file=no benchmark/batch_execution.jl --steady-only --seconds 0.01 --qubits 2 --depth 2 --batches 1,4
      - name: Check optional mixed batch AD adapter in a fresh process
        run: julia --project=benchmark --startup-file=no benchmark/batch_execution.jl --steady-only --with-zygote --seconds 0.01 --qubits 2 --depth 2 --batches 1,4
