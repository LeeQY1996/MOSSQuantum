name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia }} / ${{ matrix.threads }} threads
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - julia: '1.6'
            threads: '1'
          - julia: '1.10'
            threads: '4'
          - julia: '1'
            threads: '4'
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
      GKSwstype: '100'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - name: Resolve dependencies for this Julia version
        shell: julia --project=. {0}
        run: |
          using Pkg
          # The development manifest may have been generated by a newer Julia.
          rm("Manifest.toml"; force=true)
          Pkg.instantiate()
      - name: Run package tests
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.test()'
